name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/tv-wireguard-${{ steps.ver.outputs.version }}.apk"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TV WireGuard ${{ steps.ver.outputs.tag }}
          body: |
            ## TV WireGuard ${{ steps.ver.outputs.tag }}

            Android TV клиент WireGuard (debug-подписанный APK для sideload).

            ### Установка
            1. Скачайте `tv-wireguard-${{ steps.ver.outputs.version }}.apk`
            2. Установите на ТВ через `adb install -r ...` или файловый менеджер
            3. Вставьте WireGuard `.conf` peer из Keenetic
            4. Включите автозапуск / Always-on VPN при необходимости

            Подробности — в [README](https://github.com/FilippovRI/tv-wireguard#readme).
          files: dist/tv-wireguard-${{ steps.ver.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
